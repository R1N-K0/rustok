name: Demo GIF

# Renders assets/demo.tape into assets/demo.gif and commits the result.
# Run it from the Actions tab, or let it fire whenever the tape changes.
# VHS needs a real terminal, so this is easiest on Linux CI rather than locally.
on:
  workflow_dispatch:
  push:
    paths:
      - "assets/demo.tape"
      - ".github/workflows/demo.yml"

permissions:
  contents: write

env:
  VHS_VERSION: "0.11.0"
  TTYD_VERSION: "1.7.7"

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build the binary the tape records
        run: cargo build --release --locked

      # Installed by hand rather than via charmbracelet/vhs-action, whose
      # bundled ffmpeg downloader fetches from a third-party release feed and
      # breaks when that feed moves. apt and the upstream releases are stable.
      - name: Install VHS and its dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-jetbrains-mono
          sudo curl -fsSL -o /usr/local/bin/ttyd \
            "https://github.com/tsl0922/ttyd/releases/download/${TTYD_VERSION}/ttyd.x86_64"
          sudo chmod +x /usr/local/bin/ttyd
          mkdir -p /tmp/vhs
          curl -fsSL "https://github.com/charmbracelet/vhs/releases/download/v${VHS_VERSION}/vhs_${VHS_VERSION}_Linux_x86_64.tar.gz" \
            | tar xz -C /tmp/vhs
          sudo install -m755 "$(find /tmp/vhs -name vhs -type f | head -1)" /usr/local/bin/vhs
          vhs --version

      - name: Render the tape
        run: vhs assets/demo.tape

      - name: Commit the GIF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- assets/demo.gif; then
            echo "demo.gif unchanged"
            exit 0
          fi
          git add assets/demo.gif
          git commit -m "chore: regenerate demo.gif"
          git push
