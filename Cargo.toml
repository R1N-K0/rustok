[package]
name = "rustok"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Fast OpenAI token counter for files, directories and stdin"
authors = ["R1N-K0"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/R1N-K0/rustok"
homepage = "https://github.com/R1N-K0/rustok"
readme = "README.md"
keywords = ["tiktoken", "tokenizer", "openai", "llm", "cli"]
categories = ["command-line-utilities", "text-processing"]
exclude = ["/.github", "/assets"]

# The crate is `rustok` on crates.io because `tok` was taken, but the command
# users actually type stays `tok`.
[[bin]]
name = "tok"
path = "src/main.rs"

[dependencies]
anstream = "1.0"
anstyle = "1.0"
anyhow = "1.0"
clap = { version = "4.6.6", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.6"
ignore = "0.4"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tiktoken-rs = "0.12.0"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
